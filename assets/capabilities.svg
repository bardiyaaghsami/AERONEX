<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="t d">
<title id="t">What AERONEX does</title>
<desc id="d">Four stages: fly a PX4 SITL vehicle in Gazebo Harmonic; sense with 3D LiDAR, RGB-D and IMU on ROS 2 Jazzy; estimate trajectory and 3D map with SLAM pipelines; measure the error against ground truth.</desc>
