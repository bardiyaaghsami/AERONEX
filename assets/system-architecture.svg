<title id="t">AERONEX technical architecture, Experiment 01</title>
<desc id="d">Gazebo Harmonic and PX4 SITL; simulated 3D LiDAR, RGB-D and IMU; recorded dataset and ground truth; offline replay into FAST-LIVO2, RTAB-Map and R3LIVE (did not complete); trajectory and 3D map evaluation; ground truth used for evaluation only. Planned: autonomous navigation, height-drift mitigation.</desc>
