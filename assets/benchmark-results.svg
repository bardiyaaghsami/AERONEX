<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 436" width="1000" height="436" role="img" aria-labelledby="t d">
<title id="t">Experiment 01 benchmark results</title>
<desc id="d">Online odometry 3D ATE RMSE on 3,487 common timestamps: FAST-LIVO2 0.228 m, RTAB-Map 0.744 m and 1.355 m, R3LIVE did not complete. Offline RTAB-Map graph optimisation at keyframes: about 0.082 m and 0.116 m. Observed-map completeness within 0.2 m: about 98.0 % and 96.8 %, not full warehouse coverage.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B8BDC7"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E97F22"/></marker>

</defs>
<rect width="1000" height="436" rx="14" fill="#101113"/>
<text x="36" y="44" fill="#E97F22" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="13" font-weight="600" text-anchor="start" letter-spacing="2.2">EXPERIMENT 01 · THREE OUTPUTS, THREE EVALUATION CONDITIONS</text>
<g transform="translate(0 -34)">
<rect x="36" y="112" width="372" height="330" rx="10" fill="#1B1F24" stroke="#2E343B"/>
<text x="58" y="146" fill="#E97F22" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" font-weight="700" text-anchor="start" letter-spacing="2">ONLINE ODOMETRY</text>
<path d="M58 376H386" stroke="#2E343B"/>
<text x="58" y="402" fill="#B8BDC7" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" font-weight="400" text-anchor="start">3D ATE RMSE · real-time output</text>
<text x="58" y="422" fill="#B8BDC7" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" font-weight="400" text-anchor="start">3,487 common timestamps</text>
<text x="58" y="210" fill="#E97F22" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="50" font-weight="700">0.228<tspan dx="6" font-size="22" font-weight="600" fill="#B8BDC7">m</tspan></text>
<text x="58" y="236" fill="#F5F7FA" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">FAST-LIVO2</text>
<text x="58" y="277" fill="#B8BDC7" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" text-anchor="start">FAST-LIVO2</text>
<rect x="178" y="265" width="210" height="14" rx="2" fill="#101113"/>
<rect x="178" y="265" width="27.4" height="14" rx="2" fill="#E97F22"/>
<text x="213.36" y="277" fill="#E97F22" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="13" font-weight="600" text-anchor="start">0.228</text>
<text x="58" y="305" fill="#B8BDC7" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" text-anchor="start">RTAB-Map run 1</text>
<rect x="178" y="293" width="210" height="14" rx="2" fill="#101113"/>
<rect x="178" y="293" width="89.3" height="14" rx="2" fill="#B8BDC7"/>
<text x="275.28" y="305" fill="#F5F7FA" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="13" font-weight="600" text-anchor="start">0.744</text>
<text x="58" y="333" fill="#B8BDC7" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" text-anchor="start">RTAB-Map run 2</text>
<rect x="178" y="321" width="210" height="14" rx="2" fill="#101113"/>
<rect x="178" y="321" width="162.6" height="14" rx="2" fill="#B8BDC7"/>
<text x="348.6" y="333" fill="#F5F7FA" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="13" font-weight="600" text-anchor="start">1.355</text>
<text x="58" y="361" fill="#B8BDC7" fill-opacity="0.8" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" text-anchor="start">R3LIVE · did not complete</text>
<rect x="426" y="112" width="262" height="330" rx="10" fill="#1B1F24" stroke="#2E343B"/>
<text x="448" y="146" fill="#E97F22" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" font-weight="700" text-anchor="start" letter-spacing="2">OFFLINE GRAPH OPT.</text>
<path d="M448 376H666" stroke="#2E343B"/>
<text x="448" y="402" fill="#B8BDC7" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" font-weight="400" text-anchor="start">RTAB-Map · keyframes</text>
<text x="448" y="422" fill="#B8BDC7" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" font-weight="400" text-anchor="start">post-run · not online accuracy</text>
<text x="448" y="210" fill="#F5F7FA" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="44" font-weight="700">≈ 0.082<tspan dx="6" font-size="20" font-weight="600" fill="#B8BDC7">m</tspan></text>
<text x="448" y="236" fill="#B8BDC7" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="13.5" font-weight="400" text-anchor="start">run 1</text>
<text x="448" y="298" fill="#F5F7FA" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="44" font-weight="700">≈ 0.116<tspan dx="6" font-size="20" font-weight="600" fill="#B8BDC7">m</tspan></text>
<text x="448" y="324" fill="#B8BDC7" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="13.5" font-weight="400" text-anchor="start">run 2</text>
<rect x="706" y="112" width="258" height="330" rx="10" fill="#1B1F24" stroke="#2E343B"/>
<text x="728" y="146" fill="#E97F22" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" font-weight="700" text-anchor="start" letter-spacing="2">MAP COMPLETENESS</text>
<path d="M728 376H942" stroke="#2E343B"/>
<text x="728" y="402" fill="#B8BDC7" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" font-weight="400" text-anchor="start">within 0.2 m of observed LiDAR</text>
<text x="728" y="422" fill="#B8BDC7" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" font-weight="400" text-anchor="start">not full warehouse coverage</text>
<text x="728" y="210" fill="#F5F7FA" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="44" font-weight="700">98.0<tspan dx="6" font-size="20" font-weight="600" fill="#B8BDC7">%</tspan></text>
<text x="728" y="236" fill="#B8BDC7" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="13.5" font-weight="400" text-anchor="start">RTAB-Map run 1</text>
<text x="728" y="298" fill="#F5F7FA" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="44" font-weight="700">96.8<tspan dx="6" font-size="20" font-weight="600" fill="#B8BDC7">%</tspan></text>
<text x="728" y="324" fill="#B8BDC7" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="13.5" font-weight="400" text-anchor="start">RTAB-Map run 2</text>
<text x="36" y="464" fill="#B8BDC7" fill-opacity="0.85" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Online and offline values are different outputs and are not directly comparable.</text>
</g>
<rect x="0.5" y="0.5" width="999" height="435" rx="13.5" fill="none" stroke="#2E343B"/>
